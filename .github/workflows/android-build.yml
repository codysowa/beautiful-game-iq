name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_ADMOB_ANDROID_BANNER_ID: ${{ vars.ADMOB_ANDROID_BANNER_ID }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android AdMob application ID
        env:
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          # Google-provided demo app ID keeps cloud builds safe before AdMob is configured.
          app_id = os.environ.get('ADMOB_ANDROID_APP_ID', '').strip() or 'ca-app-pub-3940256099942544~3347511713'
          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = ET.parse(manifest_path)
          root = manifest.getroot()
          android_ns = '{http://schemas.android.com/apk/res/android}'
          application = root.find('application')
          if application is None:
              raise SystemExit('Android manifest has no application element')
          for item in application.findall('meta-data'):
              if item.get(android_ns + 'name') == 'com.google.android.gms.ads.APPLICATION_ID':
                  application.remove(item)
          ET.SubElement(application, 'meta-data', {
              android_ns + 'name': 'com.google.android.gms.ads.APPLICATION_ID',
              android_ns + 'value': '@string/admob_app_id',
          })
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          manifest.write(manifest_path, encoding='utf-8', xml_declaration=True)

          strings_path = Path('android/app/src/main/res/values/strings.xml')
          strings_tree = ET.parse(strings_path)
          resources = strings_tree.getroot()
          for item in resources.findall('string'):
              if item.get('name') == 'admob_app_id':
                  resources.remove(item)
          ET.SubElement(resources, 'string', {'name': 'admob_app_id'}).text = app_id
          strings_tree.write(strings_path, encoding='utf-8', xml_declaration=True)
          print('Configured AdMob application ID for Android build.')
          PY

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Smoke test APK in Android emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.beautifulgameiq.app 1
            sleep 15
            adb logcat -d -t 2500 > emulator-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com.beautifulgameiq.app.*has died' emulator-logcat.txt; then
              echo "App crashed during emulator smoke test."
              exit 1
            fi
            echo "APK installed and launched in Android emulator without a detected crash."

      - name: Upload APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: beautiful-game-iq-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
