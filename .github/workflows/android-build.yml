name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [android/google-play-prep]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_ADMOB_ANDROID_BANNER_ID: ${{ vars.ADMOB_ANDROID_BANNER_ID }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Set unique Google Play version code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          content = path.read_text()
          if 'versionCode 1' not in content:
              raise SystemExit('Expected generated Android versionCode 1 not found; refusing unsafe replacement.')
          content = content.replace('versionCode 1', 'versionCode 3', 1)
          content = content.replace('versionName "1.0"', 'versionName "1.0.2"', 1)
          path.write_text(content)
          print('Set Android versionCode=3 and versionName=1.0.2')
          PY

      - name: Generate branded Android launcher icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET

          source = Image.open('public/bgiq-app-icon.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for density, size in sizes.items():
              folder = Path(f'android/app/src/main/res/mipmap-{density}')
              folder.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(folder / 'ic_launcher.png')
          # Android 8+ adaptive icon: branded foreground over a dark, safe background.
          drawable = Path('android/app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)
          foreground = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
          mark = source.copy()
          mark.thumbnail((284, 284), Image.Resampling.LANCZOS)
          foreground.alpha_composite(mark, ((432 - mark.width) // 2, (432 - mark.height) // 2))
          foreground.save(drawable / 'ic_launcher_foreground.png')
          colors = Path('android/app/src/main/res/values/ic_launcher_background.xml')
          if colors.exists():
              tree = ET.parse(colors)
              root = tree.getroot()
              color = root.find("color[@name='ic_launcher_background']")
              if color is None:
                  color = ET.SubElement(root, 'color', {'name': 'ic_launcher_background'})
              color.text = '#07101B'
              tree.write(colors, encoding='utf-8', xml_declaration=True)
          else:
              values = Path('android/app/src/main/res/values')
              values.mkdir(parents=True, exist_ok=True)
              root = ET.Element('resources')
              ET.SubElement(root, 'color', {'name': 'ic_launcher_background'}).text = '#07101B'
              ET.ElementTree(root).write(colors, encoding='utf-8', xml_declaration=True)
          adaptive = Path('android/app/src/main/res/mipmap-anydpi-v26')
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / 'ic_launcher.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background" />\n'
              '    <foreground android:drawable="@drawable/ic_launcher_foreground" />\n'
              '</adaptive-icon>\n'
          )
          print('Generated Beautiful Game IQ launcher icons.')
          PY

      - name: Configure Android AdMob application ID
        env:
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          # Google-provided demo app ID keeps cloud builds safe before AdMob is configured.
          app_id = os.environ.get('ADMOB_ANDROID_APP_ID', '').strip() or 'ca-app-pub-3940256099942544~3347511713'
          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = ET.parse(manifest_path)
          root = manifest.getroot()
          android_ns = '{http://schemas.android.com/apk/res/android}'
          application = root.find('application')
          if application is None:
              raise SystemExit('Android manifest has no application element')
          for item in application.findall('meta-data'):
              if item.get(android_ns + 'name') == 'com.google.android.gms.ads.APPLICATION_ID':
                  application.remove(item)
          ET.SubElement(application, 'meta-data', {
              android_ns + 'name': 'com.google.android.gms.ads.APPLICATION_ID',
              android_ns + 'value': '@string/admob_app_id',
          })
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          manifest.write(manifest_path, encoding='utf-8', xml_declaration=True)

          strings_path = Path('android/app/src/main/res/values/strings.xml')
          strings_tree = ET.parse(strings_path)
          resources = strings_tree.getroot()
          for item in resources.findall('string'):
              if item.get('name') == 'admob_app_id':
                  resources.remove(item)
          ET.SubElement(resources, 'string', {'name': 'admob_app_id'}).text = app_id
          strings_tree.write(strings_path, encoding='utf-8', xml_declaration=True)
          print('Configured AdMob application ID for Android build.')
          PY

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: beautiful-game-iq-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
