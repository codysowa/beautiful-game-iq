name: Admin analytics build check

on:
  push:
    branches:
      - feature/admin-analytics-master
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/admin-analytics-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
