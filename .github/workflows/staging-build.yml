name: Validate BGIQ staging build

on:
  push:
    branches:
      - dev/v2-backoffice-redesign-20261021
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Build web app and sync Capacitor
    if: github.ref == 'refs/heads/dev/v2-backoffice-redesign-20261021'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build web app
        run: npm run build
      - name: Sync Capacitor iOS project
        run: npx cap sync ios
      - name: Compile native iOS target without signing
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BGIQUnsigned.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
